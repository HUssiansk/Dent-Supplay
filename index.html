<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة Dent Supply</title>

<style>
:root{--bg:#f4f8fb;--panel:#fff;--ink:#16323f;--soft:#4c6673;--primary:#1c6e8c;--dark:#124a5f;--line:#dfeaf0;--danger:#b3543f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Segoe UI,Tahoma,sans-serif}
.wrap{max-width:1000px;margin:auto;padding:28px 16px 60px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 14px 40px #16323f14}
.brand{display:flex;gap:12px;align-items:center;color:var(--dark);margin-bottom:18px}
.mark{width:48px;height:48px;border-radius:14px;background:var(--primary);display:grid;place-items:center}
.mark svg{width:28px;stroke:#fff}
.brand strong{display:block;font-size:1.15rem}
.brand small{color:var(--soft)}
h1{margin:0 0 10px;color:var(--dark)}
.sub{margin:0 0 20px;color:var(--soft)}
form{display:grid;gap:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
label{display:grid;gap:7px;font-weight:700}
input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fbfdff;font:inherit;color:var(--ink)}
textarea{min-height:100px;resize:vertical}
.actions{display:flex;gap:10px;flex-wrap:wrap}
button{border:0;border-radius:11px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer}
.primary{background:var(--primary);color:#fff}
.secondary,.mini{background:var(--bg);color:var(--dark);border:1px solid var(--line)}
button:disabled{opacity:.55;cursor:wait}
.status{display:none;margin-top:16px;padding:12px;border-radius:11px;font-weight:700}
.status.show{display:block}
.list{display:grid;gap:10px;margin-top:24px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:13px;padding:14px}
.item strong,.item small{display:block}
.item small{color:var(--soft)}
.danger{background:#fff3f1;color:var(--danger);border:1px solid #f0d8d1}

.image-help{font-size:12px;color:var(--soft);font-weight:500}
.preview-wrap{display:none;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:#f8fcfd}
.preview-wrap.show{display:flex}
.preview{width:74px;height:74px;border-radius:10px;object-fit:cover;border:1px solid var(--line);background:#eef7fa}
.preview-info{font-size:12px;color:var(--soft)}
.file-input{padding:9px 10px;background:#fff}

@media(max-width:620px){
.item{display:grid}
.item-actions{display:flex}
.item-actions button{flex:1}
}
</style>
</head>

<body>

<main class="wrap">
<section class="panel">

<div class="brand">
<span class="mark">
<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M12 5c-1.6-1.6-4.8-2-6.2-.6C4.1 5.7 4 8.5 5 11c.8 2 1.4 4 1.6 6.2.1 1.4 1 2.3 2 2.3s1.6-1 1.8-2.4c.3-2.2.7-3.8 1.6-3.8s1.3 1.6 1.6 3.8c.2 1.4.8 2.4 1.8 2.4s1.9-.9 2-2.3c.2-2.2.8-4.2 1.6-6.2 1-2.5.9-5.3-.8-6.6C17.8 3 14.6 3.4 13 5"/>
</svg>
</span>
<span>
<strong>Dent Supply</strong>
<small>لوحة إدارة مستلزمات وأدوات الأسنان</small>
</span>
</div>

<h1>إدارة المنتجات</h1>
<p class="sub">أضف المنتج واختر الصورة من جهازك. الصورة تُرفع تلقائياً إلى Supabase Storage ويحفظ رابطها مع المنتج.</p>

<form id="form">

<div class="grid">

<label>
اسم المنتج
<input name="name" required>
</label>

<label>
الفئة
<select name="category" required>
<option value="Composites">Composites</option>
<option value="Instruments">Instruments</option>
<option value="Devices">Devices</option>
<option value="Surgical Instruments">Surgical Instruments</option>
<option value="Disposable Items">Disposable Items</option>
<option value="Prosthetic Equipment">Prosthetic Equipment</option>
</select>
</label>

<label>
السعر (د.ع)
<input name="price" type="number" min="0" required>
</label>

<label>
صورة المنتج
<input
class="file-input"
name="image_file"
id="imageFile"
type="file"
accept="image/jpeg,image/png,image/webp,image/gif">
<span class="image-help">
اختر JPG أو PNG أو WEBP أو GIF — الحد الأقصى 5MB.
</span>
</label>

</div>

<div class="preview-wrap" id="previewWrap">
<img class="preview" id="previewImage" alt="معاينة الصورة">
<div class="preview-info" id="previewInfo"></div>
</div>

<input type="hidden" name="image_url" id="imageUrl">

<label>
الوصف
<textarea name="description"></textarea>
</label>

<div class="actions">
<button class="primary" id="saveBtn">حفظ المنتج</button>
<button type="button" class="secondary" id="clear">مسح الحقول</button>
</div>

</form>

<div id="status" class="status"></div>
<div id="list" class="list"></div>

</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPA_URL='https://ncurbamdczoiafvcnhzd.supabase.co';

const KEY='sb_publishable_I_8sCiOUrVQzSi_6inzPYQ_nzWfZksF';

const STORAGE_BUCKET='product-images';

const db=window.supabase.createClient(
SUPA_URL,
KEY
);

const CATEGORIES=[
'Composites',
'Instruments',
'Devices',
'Surgical Instruments',
'Disposable Items',
'Prosthetic Equipment'
];

const OLD_CATEGORY_MAP={
exam:'Instruments',
fill:'Composites',
surgery:'Surgical Instruments',
clean:'Instruments',
consumables:'Disposable Items',
'surgical instruments':'Surgical Instruments',
'Disposable items':'Disposable Items',
'Prosetheice equipment':'Prosthetic Equipment',
'Prostheice equipment':'Prosthetic Equipment'
};

const DEFAULT_PRODUCTS=[

{
id:'p1',
category:'Instruments',
name:'مسبر أسنان مزدوج',
description:'مسبر فحص دقيق من ستانلس ستيل طبي.',
price:8500,
image_url:'https://raw.githubusercontent.com/HUssiansk/Dent-Supplay/main/products/p1.jpg'
},

{
id:'p2',
category:'Instruments',
name:'مرآة فحص فم رقم 5',
description:'مرآة عاكسة بجودة عالية ومقبض مريح.',
price:6000,
image_url:'https://raw.githubusercontent.com/HUssiansk/Dent-Supplay/main/products/p2.jpg'
},

{
id:'p3',
category:'Instruments',
name:'ملقط فحص أسنان',
description:'ملقط دقيق لإمساك القطن والمواد أثناء الفحص.',
price:7000,
image_url:'https://raw.githubusercontent.com/HUssiansk/Dent-Supplay/main/products/p3.jpg'
},

{
id:'p4',
category:'Composites',
name:'طقم أدوات حشو مركب',
description:'طقم كامل لوضع وتشكيل الحشوات التجميلية.',
price:32000,
image_url:'https://raw.githubusercontent.com/HUssiansk/Dent-Supplay/main/products/p4.webp'
},

{
id:'p5',
category:'Composites',
name:'سباتيولا خلط الحشوة',
description:'مقاس مزدوج لخلط مواد الحشو والسمنت.',
price:9500,
image_url:'https://raw.githubusercontent.com/HUssiansk/Dent-Supplay/main/products/p5.jpg'
},

{
id:'p6',
category:'Composites',
name:'أداة كاربر لتشكيل الحشو',
description:'طرفين للنحت الدقيق قبل التصلب.',
price:11000,
image_url:''
},

{
id:'p7',
category:'Surgical Instruments',
name:'ملقط قلع أضراس علوي',
description:'ستانلس ستيل جراحي معتمد ومريح.',
price:45000,
image_url:''
},

{
id:'p8',
category:'Surgical Instruments',
name:'مبعد أنسجة جراحي',
description:'لإبعاد اللثة أثناء العمليات البسيطة.',
price:21000,
image_url:''
},

{
id:'p9',
category:'Surgical Instruments',
name:'مشرط جراحي بشفرات بديلة',
description:'مقبض قابل لإعادة الاستخدام مع شفرات معقمة.',
price:15500,
image_url:''
},

{
id:'p10',
category:'Instruments',
name:'مقياس تارتار وتنظيف',
description:'طرفين لإزالة الجير من السطح.',
price:13000,
image_url:''
},

{
id:'p11',
category:'Instruments',
name:'طقم تلميع الأسنان',
description:'كؤوس تلميع مطاطية بثلاث درجات خشونة.',
price:17000,
image_url:''
},

{
id:'p12',
category:'Disposable Items',
name:'قفازات فحص لاتكس',
description:'صندوق 100 قفاز، مقاسات متعددة.',
price:12000,
image_url:'https://raw.githubusercontent.com/HUssiansk/Dent-Supplay/main/products/p12.jpg'
},

{
id:'p13',
category:'Disposable Items',
name:'كمامات طبية ثلاثية الطبقات',
description:'صندوق 50 كمامة معتمدة طبياً.',
price:8000,
image_url:''
},

{
id:'p14',
category:'Disposable Items',
name:'لفافات قطن طبي للفم',
description:'عبوة 100 قطعة، امتصاص عالي.',
price:4500,
image_url:''
}

];

let editing=null;

const $=s=>document.querySelector(s);

const form=$('#form');
const imageFile=$('#imageFile');
const previewWrap=$('#previewWrap');
const previewImage=$('#previewImage');
const previewInfo=$('#previewInfo');
const saveBtn=$('#saveBtn');

function status(t,bad=false){

const e=$('#status');

e.textContent=t;

e.className='status show';

e.style.color=bad?'#b3543f':'#16865b';

e.style.background=bad?'#fff3f1':'#edf8f2';

}

function mapCategory(c){

return CATEGORIES.includes(c)
?c
:OLD_CATEGORY_MAP[c]||'Instruments';

}

function normalize(p){

return{
id:p.id,
name:p.name||'',
category:mapCategory(p.category||p.cat||'Instruments'),
description:p.description||p.desc||'',
price:Number(p.price)||0,
image_url:p.image_url||''
};

}

function safeExt(file){

const e=(file.name.split('.').pop()||'jpg').toLowerCase();

return[
'jpg',
'jpeg',
'png',
'webp',
'gif'
].includes(e)?e:'jpg';

}

async function uploadProductImage(file){

if(!file)return '';

if(!file.type.startsWith('image/')){
throw new Error('الملف المختار ليس صورة.');
}

if(file.size>5*1024*1024){
throw new Error('حجم الصورة أكبر من 5MB.');
}

const ext=safeExt(file);

const rid=crypto.randomUUID
?crypto.randomUUID()
:Math.random().toString(36).slice(2);

const path=`products/${Date.now()}-${rid}.${ext}`;

const{error}=await db.storage
.from(STORAGE_BUCKET)
.upload(
path,
file,
{
cacheControl:'3600',
upsert:false,
contentType:file.type
}
);

if(error)throw error;

const{data}=db.storage
.from(STORAGE_BUCKET)
.getPublicUrl(path);

if(!data?.publicUrl){
throw new Error('تعذر إنشاء رابط الصورة.');
}

return data.publicUrl;

}

function showPreview(file){

if(!file){

previewWrap.classList.remove('show');

previewImage.removeAttribute('src');

previewInfo.textContent='';

return;

}

const url=URL.createObjectURL(file);

previewImage.src=url;

previewInfo.textContent=
`${file.name} — ${(file.size/1024/1024).toFixed(2)} MB`;

previewWrap.classList.add('show');

}

imageFile.addEventListener(
'change',
()=>showPreview(imageFile.files?.[0])
);

async function seedProducts(){

try{

const{data:rows,error:getErr}=
await db.from('products').select('id');

if(getErr)throw getErr;

if(rows&&rows.length)return;

const payload=DEFAULT_PRODUCTS.map(
p=>({...p,created_at:new Date().toISOString()})
);

const{error:insertErr}=
await db.from('products').insert(payload);

if(insertErr)throw insertErr;

status('تمت إضافة المنتجات الأساسية إلى قاعدة البيانات.');

}catch(err){

console.error(err);

status(
'تعذر تهيئة المنتجات الأساسية: '+(err.message||err),
true
);

}

}

async function load(){

try{

await seedProducts();

const{
data,
error
}=await db
.from('products')
.select('*')
.order('created_at',{ascending:false});

if(error){

status(
'تعذر قراءة المنتجات من Supabase: '+error.message,
true
);

return;

}

render((data||[]).map(normalize));

}catch(err){

status(
'تعذر تحميل المنتجات: '+(err.message||err),
true
);

}

}

function render(items){

$('#list').innerHTML=items.length

?items.map(p=>`

<div class="item">

<div>
<strong>${escapeHtml(p.name)}</strong>

<small>
${escapeHtml(p.category)}
•
${p.price.toLocaleString('ar-IQ')}
د.ع
</small>

</div>

<div class="item-actions">

<button
class="mini"
data-edit="${escapeHtml(p.id)}">
تعديل
</button>

<button
class="mini danger"
data-delete="${escapeHtml(p.id)}">
حذف
</button>

</div>

</div>

`).join('')

:'<div class="item">لا توجد منتجات في قاعدة البيانات.</div>';

}

function escapeHtml(v){

return String(v??'').replace(
/[&<>"']/g,
m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'
}[m])
);

}

function clear(){

form.reset();

editing=null;

form.querySelector('[name=category]').value='Instruments';

form.querySelector('[name=price]').value='';

$('#imageUrl').value='';

imageFile.value='';

showPreview(null);

saveBtn.textContent='حفظ المنتج';

}

form.addEventListener(
'submit',
async e=>{

e.preventDefault();

const f=new FormData(form);

const file=imageFile.files?.[0];

const row={
name:String(f.get('name')||'').trim(),
category:mapCategory(f.get('category')),
description:String(f.get('description')||'').trim(),
price:Number(f.get('price')||0),
image_url:String(f.get('image_url')||'').trim()
};

if(!row.name){

status('اكتب اسم المنتج.',true);

return;

}

if(row.price<0||!Number.isFinite(row.price)){

status('أدخل سعراً صحيحاً.',true);

return;

}

try{

saveBtn.disabled=true;

if(file){

status('جاري رفع الصورة إلى Supabase...');

row.image_url=
await uploadProductImage(file);

$('#imageUrl').value=row.image_url;

}

status(
editing
?'جاري تحديث المنتج...'
:'جاري حفظ المنتج...'
);

let result;

if(editing){

result=await db
.from('products')
.update(row)
.eq('id',editing);

}else{

result=await db
.from('products')
.insert({
...row,
id:'p'+Date.now()
});

}

if(result.error)throw result.error;

status(
editing
?'تم تحديث المنتج والصورة بنجاح.'
:'تمت إضافة المنتج والصورة بنجاح.'
);

clear();

await load();

}catch(err){

console.error(err);

let message=err?.message||String(err);

if(
message.toLowerCase().includes('row-level security')||
message.toLowerCase().includes('violates row-level security')
){

message=
'رفع الصورة مرفوض من Storage بسبب سياسة الصلاحيات (RLS). تأكد من وجود سياسة INSERT للـbucket product-images للمستخدم المسموح له.';

}

status(
'فشل الحفظ: '+message,
true
);

}finally{

saveBtn.disabled=false;

}

});

$('#list').addEventListener(
'click',
async e=>{

const edit=e.target.closest('[data-edit]');

const del=e.target.closest('[data-delete]');

if(edit){

const{
data,
error
}=await db
.from('products')
.select('*')
.eq('id',edit.dataset.edit)
.single();

if(error){

status(error.message,true);

return;

}

const p=normalize(data);

editing=p.id;

form.name.value=p.name;

form.category.value=p.category;

form.price.value=p.price;

form.description.value=p.description;

$('#imageUrl').value=p.image_url;

imageFile.value='';

if(p.image_url){

previewImage.src=p.image_url;

previewInfo.textContent=
'الصورة الحالية — اختر صورة جديدة لاستبدالها.';

previewWrap.classList.add('show');

}else{

showPreview(null);

}

saveBtn.textContent='تحديث المنتج';

window.scrollTo({
top:0,
behavior:'smooth'
});

}

if(del&&confirm('حذف المنتج؟')){

const{error}=await db
.from('products')
.delete()
.eq('id',del.dataset.delete);

if(error){

status(
'فشل الحذف: '+error.message,
true
);

}else{

status('تم حذف المنتج.');

await load();

}

}

});

$('#clear').onclick=clear;

clear();

load();

</script>

</body>
</html>
