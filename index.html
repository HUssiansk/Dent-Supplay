<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dent Supply</title>
<script>
(async function () {
  try {
    const response = await fetch('https://raw.githubusercontent.com/HUssiansk/Dent-Supplay/5385e51cdb051b219ae04f71f1115f18ee65164c/index.html', { cache: 'no-store' });
    if (!response.ok) throw new Error('old storefront unavailable');
    let html = await response.text();
    html = html.replace('</head>', '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script></head>');
    const bridge = `
<script>
(async function(){
  try {
    const client = window.supabase.createClient('https://ncurbamdczoiafvcnhzd.supabase.co','sb_publishable_I_8sCiOUrVQzSi_6inzPYQ_nzWfZksF');
    const result = await client.from('products').select('*').order('created_at',{ascending:false});
    if (result.error) throw result.error;
    if (result.data && result.data.length) {
      DATA.products = result.data.map(function(p){ return {
        id:String(p.id), cat:p.category || p.cat || 'consumables', name:p.name,
        desc:p.description || p.desc || '', price:Number(p.price)||0
      }; });
      if (typeof renderProducts === 'function') renderProducts();
      if (typeof updateCartUI === 'function') updateCartUI();
    }
  } catch (error) { console.warn('Supabase fallback:', error); }
})();
<\/script>`;
    html = html.replace('</body>', bridge + '</body>');
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    document.body.innerHTML = '<p style="font-family:Arial;text-align:center;padding:40px">تعذر تحميل الموقع. حدّث الصفحة مرة أخرى.</p>';
  }
})();
</script>
</head>
<body></body>
</html>
