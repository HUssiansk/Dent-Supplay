<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dent Supply</title>
</head>
<body>
<div id="loading" style="font-family:Arial;text-align:center;padding:40px">جاري تحميل المتجر...</div>
<script>
(async function(){
  try{
    var url='https://raw.githubusercontent.com/HUssiansk/Dent-Supplay/5385e51cdb051b219ae04f71f1115f18ee65164c/index.html';
    var response=await fetch(url,{cache:'no-store'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    var html=await response.text();
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('loading').innerHTML='تعذر تحميل الصفحة. حاول تحديثها مرة أخرى.<br><small>'+error.message+'</small>';
    console.error(error);
  }
})();
</script>
</body>
</html>
