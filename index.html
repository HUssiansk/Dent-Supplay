<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dent Supply</title>
</head>
<body>
<div id="loading" style="font-family:Arial;text-align:center;padding:40px">جاري تحميل المتجر...</div>
<script>
(async function () {
  try {
    const source = 'https://raw.githubusercontent.com/HUssiansk/Dent-Supplay/5385e51cdb051b219ae04f71f1115f18ee65164c/index.html';
    const response = await fetch(source, { cache: 'no-store' });
    if (!response.ok) throw new Error('تعذر تحميل النسخة الأصلية');
    const html = await response.text();

    document.open();
    document.write(html);
    document.close();

    const supabaseScript = document.createElement('script');
    supabaseScript.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    supabaseScript.onload = async function () {
      try {
        const client = window.supabase.createClient(
          'https://ncurbamdczoiafvcnhzd.supabase.co',
          'sb_publishable_I_8sCiOUrVQzSi_6inzPYQ_nzWfZksF'
        );
        const result = await client.from('products').select('*').order('created_at', { ascending: false });
        if (result.error) throw result.error;
        if (!result.data || !result.data.length) return;

        const products = result.data.map(function (p) {
          return {
            id: String(p.id),
            cat: p.category || p.cat || 'consumables',
            name: p.name || '',
            desc: p.description || p.desc || '',
            price: Number(p.price) || 0,
            img: p.image_url || p.img || ''
          };
        });

        if (typeof DATA !== 'undefined') {
          DATA.products = products;
          if (typeof renderProducts === 'function') renderProducts();
          if (typeof updateCartUI === 'function') updateCartUI();
        }
      } catch (error) {
        console.warn('Supabase products fallback:', error);
      }
    };
    supabaseScript.onerror = function () { console.warn('Supabase library unavailable; showing local products.'); };
    document.head.appendChild(supabaseScript);
  } catch (error) {
    document.body.innerHTML = '<p style="font-family:Arial;text-align:center;padding:40px">تعذر فتح الصفحة. حدّثها مرة أخرى.</p>';
    console.error(error);
  }
})();
</script>
</body>
</html>
