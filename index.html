<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dent Supply</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--p:#1c6e8c;--d:#124a5f;--bg:#f5f9fb;--line:#dce8ed;--muted:#58717d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#16323f;font-family:Arial,Tahoma,sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:16px}.head,.wrap{max-width:1100px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-weight:800;color:var(--d);font-size:1.25rem}.logo small{display:block;color:var(--muted);font-size:.72rem;font-weight:400;margin-top:4px}.btn{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:700}.primary{background:var(--p);color:#fff}.light{background:#edf5f8;color:var(--d);border:1px solid var(--line)}.hero{margin:24px 16px;padding:34px 24px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#eaf8f8,#eef5ff)}.hero h1{margin:0 0 10px;color:var(--d)}.hero p{color:var(--muted);line-height:1.8;max-width:650px}.controls{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 16px}.cats{display:flex;gap:8px;flex-wrap:wrap}.cat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:9px 13px;cursor:pointer}.cat.active{background:var(--p);color:#fff}.search{padding:10px 12px;border:1px solid var(--line);border-radius:10px;width:230px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;padding:0 16px 50px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.media{height:170px;display:grid;place-items:center;background:#edf7fa;color:var(--p);font-size:3rem}.media img{width:100%;height:100%;object-fit:cover}.body{padding:15px}.body h3{margin:8px 0}.body p{color:var(--muted);min-height:42px;line-height:1.6}.price{font-weight:800;color:var(--d);font-size:1.1rem}.actions{display:flex;gap:8px;margin-top:12px}.actions .btn{flex:1}.empty{text-align:center;color:var(--muted);grid-column:1/-1;padding:40px}.drawer{position:fixed;inset:0 0 0 auto;width:min(410px,92vw);background:#fff;z-index:3;transform:translateX(110%);transition:.25s;box-shadow:0 0 30px #0002;padding:18px;display:flex;flex-direction:column}.drawer.open{transform:none}.drawer h2{margin-top:0}.cart{flex:1;overflow:auto}.item{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:12px 0}.qty button{border:1px solid var(--line);background:#edf5f8;border-radius:6px;margin:0 3px}.overlay{display:none;position:fixed;inset:0;background:#0006;z-index:2}.overlay.open{display:block}footer{text-align:center;color:var(--muted);padding:25px;border-top:1px solid var(--line)}
  </style>
</head>
<body>
<header><div class="head"><div class="logo">Dent Supply<small>مستلزمات وأدوات أسنان طبية</small></div><button class="btn primary" id="cartBtn">السلة <span id="count">0</span></button></div></header>
<section class="hero wrap"><h1>مستلزمات وأدوات أسنان موثوقة</h1><p>تصفح المنتجات وأرسل طلبك مباشرة عبر واتساب.</p><button class="btn primary" onclick="document.getElementById('catalog').scrollIntoView()">تسوق الآن</button></section>
<div class="controls wrap"><div class="cats" id="cats"><button class="cat active" data-cat="all">الكل</button><button class="cat" data-cat="exam">أدوات فحص</button><button class="cat" data-cat="fill">حشو</button><button class="cat" data-cat="surgery">جراحة</button><button class="cat" data-cat="clean">تنظيف</button><button class="cat" data-cat="consumables">مستهلكات</button></div><input class="search" id="search" placeholder="ابحث عن منتج..."></div>
<main id="catalog" class="grid wrap"></main><footer>Dent Supply — الطلبات عبر واتساب</footer>
<div class="overlay" id="overlay"></div><aside class="drawer" id="drawer"><h2>سلة الطلب <button class="btn light" id="close">إغلاق</button></h2><div class="cart" id="cart"></div><strong id="total"></strong><button class="btn primary" id="checkout">إرسال الطلب عبر واتساب</button></aside>
<script>
const URL='https://ncurbamdczoiafvcnhzd.supabase.co',KEY='sb_publishable_I_8sCiOUrVQzSi_6inzPYQ_nzWfZksF',db=window.supabase.createClient(URL,KEY),wa='9647823577749';
const names={exam:'أدوات فحص',fill:'حشو وترميم',surgery:'جراحة وقلع',clean:'تنظيف وتلميع',consumables:'مستهلكات'};let products=[],cat='all',cart=JSON.parse(localStorage.getItem('dent_cart')||'{}');
const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('ar-IQ')+' د.ع';
async function load(){const {data,error}=await db.from('products').select('*').order('created_at',{ascending:false});if(error){$('catalog').innerHTML='<div class="empty">تعذر تحميل المنتجات. تأكد من إعداد Supabase.</div>';console.error(error);return}products=data||[];render()}
function render(){let q=$('search').value.trim().toLowerCase(),list=products.filter(p=>(cat==='all'||p.category===cat)&&(!q||(`${p.name} ${p.description||''}`).toLowerCase().includes(q)));$('catalog').innerHTML=list.length?list.map(p=>`<article class="card"><div class="media">${p.image_url?`<img src="${p.image_url}" alt="${p.name}">`:'🦷'}</div><div class="body"><small>${names[p.category]||p.category}</small><h3>${p.name}</h3><p>${p.description||''}</p><div class="price">${money(p.price)}</div><div class="actions"><button class="btn primary" onclick="add('${p.id}')">أضف للسلة</button><button class="btn light" onclick="quick('${p.id}')">واتساب</button></div></div></article>`).join(''):'<div class="empty">لا توجد منتجات حالياً</div>';update()}
function add(id){cart[id]=(cart[id]||0)+1;save();update();openCart()}function quick(id){let p=products.find(x=>x.id===id);window.open(`https://wa.me/${wa}?text=${encodeURIComponent('مرحباً، أريد طلب: '+p.name+' - '+money(p.price))}`,'_blank')}
function save(){localStorage.setItem('dent_cart',JSON.stringify(cart))}function update(){let ids=Object.keys(cart).filter(id=>cart[id]>0),sum=0;$('count').textContent=ids.reduce((a,id)=>a+cart[id],0);$('cart').innerHTML=ids.length?ids.map(id=>{let p=products.find(x=>x.id===id);if(!p)return '';sum+=p.price*cart[id];return `<div class="item"><span>${p.name}<br><small>${money(p.price)} × ${cart[id]}</small></span><span class="qty"><button onclick="change('${id}',-1)">−</button><button onclick="change('${id}',1)">+</button><button onclick="removeItem('${id}')">حذف</button></span></div>`}).join(''):'السلة فارغة';$('total').textContent='المجموع: '+money(sum)}function change(id,n){cart[id]=(cart[id]||0)+n;if(cart[id]<=0)delete cart[id];save();update()}function removeItem(id){delete cart[id];save();update()}function openCart(){$('drawer').classList.add('open');$('overlay').classList.add('open')}function closeCart(){$('drawer').classList.remove('open');$('overlay').classList.remove('open')}
$('search').oninput=render;$('cats').onclick=e=>{let b=e.target.closest('[data-cat]');if(!b)return;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');cat=b.dataset.cat;render()};$('cartBtn').onclick=openCart;$('close').onclick=closeCart;$('overlay').onclick=closeCart;$('checkout').onclick=()=>{let lines=Object.keys(cart).filter(id=>cart[id]>0).map(id=>{let p=products.find(x=>x.id===id);return `- ${p.name} × ${cart[id]}`});if(lines.length)window.open(`https://wa.me/${wa}?text=${encodeURIComponent('مرحباً، أريد الطلب:\n'+lines.join('\n'))}`,'_blank')};load();
</script></body></html>
