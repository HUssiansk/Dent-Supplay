<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة Dent Supply</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,Tahoma;background:#f4f8fa;color:#16323f;margin:0}.wrap{max-width:900px;margin:25px auto;padding:0 15px}.card{background:#fff;border:1px solid #dce8ed;border-radius:15px;padding:20px;margin-bottom:18px}input,textarea,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #dce8ed;border-radius:8px;font:inherit}textarea{min-height:80px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:8px;padding:11px 15px;cursor:pointer;font-weight:bold;margin:3px}.primary{background:#1c6e8c;color:#fff}.danger{background:#f8e5e0;color:#a33}.light{background:#edf5f8}.hidden{display:none}.product{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid #eee;padding:12px 0}.muted{color:#58717d}@media(max-width:600px){.row{grid-template-columns:1fr}.product{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><section id="login" class="card"><h1>لوحة إدارة Dent Supply</h1><p class="muted">أدخل كلمة المرور للمتابعة.</p><input id="password" type="password" placeholder="كلمة المرور"><button class="btn primary" id="loginBtn">دخول</button><p id="loginMsg"></p></section><main id="panel" class="hidden"><section class="card"><h1>إدارة المنتجات</h1><form id="form"><input type="hidden" id="id"><div class="row"><label>اسم المنتج<input id="name" required></label><label>السعر<input id="price" type="number" min="0" required></label></div><div class="row"><label>التصنيف<select id="category"><option value="exam">أدوات فحص</option><option value="fill">حشو وترميم</option><option value="surgery">جراحة وقلع</option><option value="clean">تنظيف وتلميع</option><option value="consumables">مستهلكات</option></select></label><label>رابط الصورة<input id="image_url"></label></div><label>الوصف<textarea id="description"></textarea></label><button class="btn primary">حفظ المنتج</button><button type="button" class="btn light" id="clear">مسح</button></form><p id="msg"></p></section><section class="card"><h2>المنتجات <span id="count"></span></h2><div id="list"></div></section></main></div><script>const db=window.supabase.createClient('https://ncurbamdczoiafvcnhzd.supabase.co','sb_publishable_I_8sCiOUrVQzSi_6inzPYQ_nzWfZksF'),PASSWORD='seno@@##',$=id=>document.getElementById(id);const defaults=[['p1','exam','مسبر أسنان مزدوج','مسبر فحص دقيق من ستانلس ستيل طبي، مقاس قياسي.',8500],['p2','exam','مرآة فحص فم رقم 5','مرآة عاكسة بمقبض معدني، مقاومة للبخار.',6000],['p3','exam','ملقط فحص أسنان','ملقط دقيق لإمساك القطن والمواد أثناء الفحص.',7000],['p4','fill','طقم أدوات حشو مركب','طقم كامل لوضع وتشكيل الحشوات التجميلية.',32000],['p5','fill','سباتيولا خلط الحشوة','مقاس مزدوج لخلط مواد الحشو والسمنت.',9500],['p6','fill','أداة كاربر لتشكيل الحشو','طرفين للنحت الدقيق قبل التصلب.',11000],['p7','surgery','ملقط قلع أضراس علوي','ستانلس ستيل جراحي معتمد، مقبض مريح.',45000],['p8','surgery','مبعد أنسجة جراحي','لإبعاد اللثة أثناء العمليات الجراحية البسيطة.',21000],['p9','surgery','مشرط جراحي بشفرات بديلة','مقبض قابل لإعادة الاستخدام مع 10 شفرات معقمة.',15500],['p10','clean','مقياس تارتار وتنظيف','طرفين لإزالة الجير من سطح وجذر السن.',13000],['p11','clean','طقم تلميع الأسنان','كؤوس تلميع مطاطية بثلاث درجات خشونة.',17000],['p12','consumables','قفازات فحص لاتكس (صندوق)','صندوق 100 قفاز، مقاسات متعددة.',12000],['p13','consumables','كمامات طبية ثلاثية الطبقات','صندوق 50 كمامة معتمدة طبياً.',8000],['p14','consumables','لفافات قطن طبي للفم','عبوة 100 قطعة، امتصاص عالي.',4500]].map(x=>({id:x[0],category:x[1],name:x[2],description:x[3],price:x[4],image_url:'products/'+x[0]+'.jpg'}));async function load(){let{data,error}=await db.from('products').select('*').order('created_at',{ascending:false});if(error){$('msg').textContent='خطأ: '+error.message;return}if(!data.length){let r=await db.from('products').insert(defaults);if(r.error){$('msg').textContent='تعذر استرجاع المنتجات: '+r.error.message;return}data=defaults}$('count').textContent=data.length;$('list').innerHTML=data.map(p=>`<div class="product"><div><b>${p.name}</b><br><span class="muted">${p.price} د.ع</span></div><div><button class="btn light" onclick='edit(${JSON.stringify(p)})'>تعديل</button><button class="btn danger" onclick="del('${p.id}')">حذف</button></div></div>`).join('')}function edit(p){$('id').value=p.id;$('name').value=p.name;$('price').value=p.price;$('category').value=p.category;$('image_url').value=p.image_url||'';$('description').value=p.description||'';scrollTo(0,0)}$('loginBtn').onclick=()=>{if($('password').value===PASSWORD){$('login').classList.add('hidden');$('panel').classList.remove('hidden');load()}else $('loginMsg').textContent='كلمة المرور غير صحيحة'};$('password').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};$('form').onsubmit=async e=>{e.preventDefault();let row={id:$('id').value||'p'+Date.now(),name:$('name').value.trim(),price:Number($('price').value),category:$('category').value,image_url:$('image_url').value.trim(),description:$('description').value.trim()};let{error}=await db.from('products').upsert(row);$('msg').textContent=error?'خطأ: '+error.message:'تم الحفظ بنجاح';if(!error){$('form').reset();$('id').value='';load()}};$('clear').onclick=()=>{$('form').reset();$('id').value=''};async function del(id){if(!confirm('حذف المنتج؟'))return;let{error}=await db.from('products').delete().eq('id',id);$('msg').textContent=error?'خطأ: '+error.message:'تم الحذف';load()}</script></body></html>
