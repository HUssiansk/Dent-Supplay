<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة Dent Supply</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,Tahoma;background:#f4f8fa;color:#16323f;margin:0}.wrap{max-width:900px;margin:25px auto;padding:0 15px}.card{background:#fff;border:1px solid #dce8ed;border-radius:15px;padding:20px;margin-bottom:18px}input,textarea,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #dce8ed;border-radius:8px;font:inherit}textarea{min-height:80px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:8px;padding:11px 15px;cursor:pointer;font-weight:bold;margin:3px}.primary{background:#1c6e8c;color:#fff}.danger{background:#f8e5e0;color:#a33}.light{background:#edf5f8}.hidden{display:none}.product{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid #eee;padding:12px 0}.muted{color:#58717d}@media(max-width:600px){.row{grid-template-columns:1fr}.product{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><section id="login" class="card"><h1>لوحة إدارة Dent Supply</h1><p class="muted">أدخل كلمة المرور للمتابعة.</p><input id="password" type="password" placeholder="كلمة المرور"><button class="btn primary" id="loginBtn">دخول</button><p id="loginMsg"></p></section><main id="panel" class="hidden"><section class="card"><h1>إدارة المنتجات</h1><form id="form"><input type="hidden" id="id"><div class="row"><label>اسم المنتج<input id="name" required></label><label>السعر<input id="price" type="number" min="0" required></label></div><div class="row"><label>التصنيف<select id="category"><option value="exam">أدوات فحص</option><option value="fill">حشو وترميم</option><option value="surgery">جراحة وقلع</option><option value="clean">تنظيف وتلميع</option><option value="consumables">مستهلكات</option></select></label><label>رابط الصورة<input id="image_url"></label></div><label>الوصف<textarea id="description"></textarea></label><button class="btn primary">حفظ المنتج</button><button type="button" class="btn light" id="clear">مسح</button></form><p id="msg"></p></section><section class="card"><h2>المنتجات <span id="count"></span></h2><div id="list"></div></section></main></div><script>const URL='https://ncurbamdczoiafvcnhzd.supabase.co',KEY='sb_publishable_I_8sCiOUrVQzSi_6inzPYQ_nzWfZksF',db=window.supabase.createClient(URL,KEY),PASSWORD='seno@@##',$=id=>document.getElementById(id);$('loginBtn').onclick=()=>{if($('password').value===PASSWORD){$('login').classList.add('hidden');$('panel').classList.remove('hidden');load()}else $('loginMsg').textContent='كلمة المرور غير صحيحة'};$('password').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};async function load(){let {data,error}=await db.from('products').select('*').order('created_at',{ascending:false});if(error){$('msg').textContent='خطأ: '+error.message;return}$('count').textContent=data.length;$('list').innerHTML=data.map(p=>`<div class="product"><div><b>${p.name}</b><br><span class="muted">${p.price} د.ع</span></div><div><button class="btn light" onclick='edit(${JSON.stringify(p)})'>تعديل</button><button class="btn danger" onclick="del('${p.id}')">حذف</button></div></div>`).join('')||'<p class="muted">لا توجد منتجات.</p>'}function edit(p){$('id').value=p.id;$('name').value=p.name;$('price').value=p.price;$('category').value=p.category;$('image_url').value=p.image_url||'';$('description').value=p.description||'';scrollTo(0,0)}$('form').onsubmit=async e=>{e.preventDefault();let id=$('id').value||'p'+Date.now(),row={id,name:$('name').value.trim(),price:Number($('price').value),category:$('category').value,image_url:$('image_url').value.trim(),description:$('description').value.trim()};let {error}=await db.from('products').upsert(row);$('msg').textContent=error?'خطأ: '+error.message:'تم الحفظ بنجاح';if(!error){$('form').reset();$('id').value='';load()}};$('clear').onclick=()=>{$('form').reset();$('id').value=''};async function del(id){if(!confirm('حذف المنتج؟'))return;let {error}=await db.from('products').delete().eq('id',id);$('msg').textContent=error?'خطأ: '+error.message:'تم الحذف';load()}</script></body></html>
