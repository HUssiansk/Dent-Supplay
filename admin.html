<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة Dent Supply</title>
<style>
:root{--bg:#f4f8fb;--panel:#fff;--ink:#16323f;--soft:#4c6673;--primary:#1c6e8c;--dark:#124a5f;--line:#dfeaf0;--ok:#16865b;--danger:#b3543f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Segoe UI,Tahoma,sans-serif}.wrap{max-width:1000px;margin:auto;padding:28px 16px 60px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 14px 40px #16323f14}.brand{display:flex;gap:12px;align-items:center;color:var(--dark);margin-bottom:18px}.mark{width:48px;height:48px;border-radius:14px;background:var(--primary);display:grid;place-items:center}.mark svg{width:28px;stroke:#fff}.brand strong{display:block;font-size:1.15rem}.brand small{color:var(--soft)}h1{margin:0 0 10px;color:var(--dark)}.sub{margin:0 0 20px;color:var(--soft)}form{display:grid;gap:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}label{display:grid;gap:7px;font-weight:700}input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fbfdff;font:inherit;color:var(--ink)}textarea{min-height:100px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--primary);color:#fff}.secondary,.mini{background:var(--bg);color:var(--dark);border:1px solid var(--line)}.status{display:none;margin-top:16px;padding:12px;border-radius:11px;font-weight:700}.status.show{display:block}.list{display:grid;gap:10px;margin-top:24px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:13px;padding:14px}.item strong,.item small{display:block}.item small{color:var(--soft)}.danger{background:#fff3f1;color:var(--danger);border:1px solid #f0d8d1}@media(max-width:620px){.item{display:grid}.item-actions{display:flex}.item-actions button{flex:1}}
</style>
</head>
<body><main class="wrap"><section class="panel">
<div class="brand"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5c-1.6-1.6-4.8-2-6.2-.6C4.1 5.7 4 8.5 5 11c.8 2 1.4 4 1.6 6.2.1 1.4 1 2.3 2 2.3s1.6-1 1.8-2.4c.3-2.2.7-3.8 1.6-3.8s1.3 1.6 1.6 3.8c.2 1.4.8 2.4 1.8 2.4s1.9-.9 2-2.3c.2-2.2.8-4.2 1.6-6.2 1-2.5.9-5.3-.8-6.6C17.8 3 14.6 3.4 13 5"/></svg></span><span><strong>Dent Supply</strong><small>لوحة إدارة مستلزمات وأدوات الأسنان</small></span></div>
<h1>إدارة المنتجات</h1><p class="sub">أي منتج تضيفه هنا يظهر في الصفحة الرئيسية عند جميع الزوار.</p>
<form id="form"><div class="grid"><label>اسم المنتج<input name="name" required></label><label>الفئة<select name="category"><option value="exam">أدوات فحص</option><option value="fill">حشو وترميم</option><option value="surgery">جراحة وقلع</option><option value="clean">تنظيف وتلميع</option><option value="consumables">مستهلكات</option></select></label><label>السعر (د.ع)<input name="price" type="number" min="0" required></label><label>رابط الصورة<input name="image_url" type="url" placeholder="https://..."></label></div><label>الوصف<textarea name="description"></textarea></label><div class="actions"><button class="primary">حفظ المنتج</button><button type="button" class="secondary" id="clear">مسح الحقول</button></div></form>
<div id="status" class="status"></div><div id="list" class="list"></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPA_URL='https://ncurbamdczoiafvcnhzd.supabase.co',KEY='sb_publishable_I_8sCiOUrVQzSi_6inzPYQ_nzWfZksF',db=window.supabase.createClient(SUPA_URL,KEY),cats={exam:'أدوات فحص',fill:'حشو وترميم',surgery:'جراحة وقلع',clean:'تنظيف وتلميع',consumables:'مستهلكات'};
const DEFAULT_PRODUCTS=[
  {id:'p1',category:'exam',name:'مسبر أسنان مزدوج',description:'مسبر فحص دقيق من ستانلس ستيل طبي.',price:8500,image_url:'https://raw.githubusercontent.com/HUssiansk/Dent-Supplay/main/products/p1.jpg'},
  {id:'p2',category:'exam',name:'مرآة فحص فم رقم 5',description:'مرآة عاكسة بجودة عالية ومقبض مريح.',price:6000,image_url:'https://raw.githubusercontent.com/HUssiansk/Dent-Supplay/main/products/p2.jpg'},
  {id:'p3',category:'exam',name:'ملقط فحص أسنان',description:'ملقط دقيق لإمساك القطن والمواد أثناء الفحص.',price:7000,image_url:'https://raw.githubusercontent.com/HUssiansk/Dent-Supplay/main/products/p3.jpg'},
  {id:'p4',category:'fill',name:'طقم أدوات حشو مركب',description:'طقم كامل لوضع وتشكيل الحشوات التجميلية.',price:32000,image_url:'https://raw.githubusercontent.com/HUssiansk/Dent-Supplay/main/products/p4.webp'},
  {id:'p5',category:'fill',name:'سباتيولا خلط الحشوة',description:'مقاس مزدوج لخلط مواد الحشو والسمنت.',price:9500,image_url:'https://raw.githubusercontent.com/HUssiansk/Dent-Supplay/main/products/p5.jpg'},
  {id:'p6',category:'fill',name:'أداة كاربر لتشكيل الحشو',description:'طرفين للنحت الدقيق قبل التصلب.',price:11000,image_url:''},
  {id:'p7',category:'surgery',name:'ملقط قلع أضراس علوي',description:'ستانلس ستيل جراحي معتمد ومريح.',price:45000,image_url:''},
  {id:'p8',category:'surgery',name:'مبعد أنسجة جراحي',description:'لإبعاد اللثة أثناء العمليات البسيطة.',price:21000,image_url:''},
  {id:'p9',category:'surgery',name:'مشرط جراحي بشفرات بديلة',description:'مقبض قابل لإعادة الاستخدام مع شفرات معقمة.',price:15500,image_url:''},
  {id:'p10',category:'clean',name:'مقياس تارتار وتنظيف',description:'طرفين لإزالة الجير من السطح.',price:13000,image_url:''},
  {id:'p11',category:'clean',name:'طقم تلميع الأسنان',description:'كؤوس تلميع مطاطية بثلاث درجات خشونة.',price:17000,image_url:''},
  {id:'p12',category:'consumables',name:'قفازات فحص لاتكس',description:'صندوق 100 قفاز، مقاسات متعددة.',price:12000,image_url:'https://raw.githubusercontent.com/HUssiansk/Dent-Supplay/main/products/p12.jpg'},
  {id:'p13',category:'consumables',name:'كمامات طبية ثلاثية الطبقات',description:'صندوق 50 كمامة معتمدة طبياً.',price:8000,image_url:''},
  {id:'p14',category:'consumables',name:'لفافات قطن طبي للفم',description:'عبوة 100 قطعة، امتصاص عالي.',price:4500,image_url:''}
];
let editing=null;
const $=s=>document.querySelector(s),form=$('#form');
function status(t,bad=false){const e=$('#status');e.textContent=t;e.className='status show';e.style.color=bad?'#b3543f':'#16865b';e.style.background=bad?'#fff3f1':'#edf8f2'}
function normalize(p){return{id:p.id,name:p.name||'',category:p.category||p.cat||'consumables',description:p.description||p.desc||'',price:Number(p.price)||0,image_url:p.image_url||''}}
async function seedProducts(){
  try{
    const {data:rows,error:getErr}=await db.from('products').select('id');
    if(getErr){throw getErr;}
    if(rows && rows.length) return;
    const payload=DEFAULT_PRODUCTS.map(p=>({
      id: p.id,
      name: p.name,
      category: p.category,
      description: p.description,
      price: p.price,
      image_url: p.image_url,
      created_at: new Date().toISOString()
    }));
    const {error:insertErr}=await db.from('products').insert(payload);
    if(insertErr) throw insertErr;
    status('تمت إضافة المنتجات الأساسية إلى قاعدة البيانات.');
  }catch(err){
    console.error(err);
    status('تعذر تهيئة المنتجات الأساسية: '+(err.message||err),true);
  }
}
async function load(){
  try{
    await seedProducts();
    const {data,error}=await db.from('products').select('*').order('created_at',{ascending:false});
    if(error){status('تعذر قراءة المنتجات من Supabase: '+error.message,true);return}
    render((data||[]).map(normalize))
  }catch(err){
    status('تعذر تحميل المنتجات: '+(err.message||err),true);
  }
}
function render(items){$('#list').innerHTML=items.length?items.map(p=>`<div class="item"><div><strong>${p.name}</strong><small>${cats[p.category]||p.category} • ${p.price.toLocaleString('ar-IQ')} د.ع</small></div><div class="item-actions"><button class="mini" data-edit="${p.id}">تعديل</button><button class="mini danger" data-delete="${p.id}">حذف</button></div></div>`).join(''):'<div class="item">لا توجد منتجات في قاعدة البيانات.</div>'}
function clear(){form.reset();editing=null;form.querySelector('[name=price]').value=''}
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const f=new FormData(form),row={name:String(f.get('name')).trim(),category:f.get('category'),description:String(f.get('description')||'').trim(),price:Number(f.get('price')||0),image_url:String(f.get('image_url')||'').trim()};
  let result;
  if(editing){
    result=await db.from('products').update(row).eq('id',editing);
  } else {
    result=await db.from('products').insert({...row,id:'p'+Date.now()});
  }
  if(result.error){status('فشل الحفظ: '+result.error.message,true);return}
  status(editing?'تم تحديث المنتج.':'تمت إضافة المنتج.');
  clear();
  load();
});
$('#list').addEventListener('click',async e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit){const {data,error}=await db.from('products').select('*').eq('id',edit.dataset.edit).single();if(error)return status(error.message,true);const p=normalize(data);editing=p.id;form.name.value=p.name;form.category.value=p.category;form.price.value=p.price;form.description.value=p.description;form.image_url.value=p.image_url;window.scrollTo({top:0,behavior:'smooth'})}if(del&&confirm('حذف المنتج؟')){const {error}=await db.from('products').delete().eq('id',del.dataset.delete);if(error)status('فشل الحذف: '+error.message,true);else{status('تم حذف المنتج.');load()}}});$('#clear').onclick=clear;load();
</script></body></html>
