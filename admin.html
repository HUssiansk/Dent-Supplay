<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>إدارة Dent Supply</title>
  <style>
    :root{
      --bg:#f4f8fb; --panel:#ffffff; --ink:#16323f; --soft:#4c6673;
      --primary:#1c6e8c; --primary-dark:#124a5f; --line:#dfeaf0;
      --success:#1b9c6b; --danger:#b3543f; --shadow:0 14px 40px rgba(22,50,63,0.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:"Segoe UI",Tahoma,sans-serif; background:var(--bg); color:var(--ink);
    }
    .wrap{
      max-width:1000px; margin:0 auto; padding:28px 16px 60px;
    }
    .panel{
      background:var(--panel); border:1px solid var(--line); border-radius:18px;
      box-shadow:var(--shadow); padding:22px;
    }
    h1{margin:0 0 12px; font-size:2rem; color:var(--primary-dark)}
    .sub{margin:0 0 18px; color:var(--soft)}
    form{display:grid; gap:14px}
    .grid{
      display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px;
    }
    label{
      display:flex; flex-direction:column; gap:8px; color:var(--ink); font-weight:700;
    }
    input,select,textarea{
      width:100%; border:1px solid var(--line); background:#fbfdff; border-radius:12px;
      padding:12px 14px; font:inherit; color:var(--ink); outline:none;
    }
    textarea{min-height:110px; resize:vertical}
    input:focus,select:focus,textarea:focus{
      border-color:var(--primary); box-shadow:0 0 0 3px rgba(28,110,140,0.12);
    }
    .actions{
      display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:8px;
    }
    button{
      border:none; border-radius:12px; padding:12px 16px; font-weight:800; cursor:pointer;
    }
    .primary{background:var(--primary); color:#fff}
    .secondary{
      background:var(--bg); color:var(--primary-dark); border:1px solid var(--line);
    }
    .status{
      margin-top:16px; padding:12px 14px; background:#edf8f2; border:1px solid #cfeadf;
      color:var(--success); border-radius:12px; display:none; font-weight:700;
    }
    .status.show{display:block}
    .list{margin-top:26px; display:grid; gap:12px}
    .item{
      border:1px solid var(--line); border-radius:14px; padding:14px;
      display:flex; justify-content:space-between; align-items:center; gap:12px; background:#fff;
    }
    .item strong{display:block}
    .item small{color:var(--soft)}
    .item-actions{display:flex; gap:8px; flex-wrap:wrap}
    .mini{
      background:var(--bg); border:1px solid var(--line); color:var(--ink);
      padding:8px 10px; border-radius:10px; font-weight:700;
    }
    .mini.danger{
      background:#fff3f1; border:1px solid #f0d8d1; color:var(--danger);
    }
    @media (max-width:620px){
      .item{flex-direction:column; align-items:flex-start}
      .item-actions{width:100%}
      .item-actions button{flex:1}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1>إدارة Dent Supply</h1>
      <p class="sub">إضافة وتحديث المنتجات مباشرةً من المتصفح، مع حفظها في المتصفح محلياً.</p>

      <form id="productForm">
        <div class="grid">
          <label>
            اسم المنتج
            <input type="text" name="name" placeholder="مثال: مسبر أسنان مزدوج" required>
          </label>
          <label>
            الفئة
            <select name="cat">
              <option value="exam">أدوات فحص</option>
              <option value="fill">حشو وترميم</option>
              <option value="surgery">جراحة وقلع</option>
              <option value="clean">تنظيف وتلميع</option>
              <option value="consumables">مستهلكات</option>
            </select>
          </label>
          <label>
            السعر (د.ع)
            <input type="number" name="price" min="0" step="1" value="0" required>
          </label>
          <label>
            رابط الصورة
            <input type="url" name="image_url" placeholder="https://.../image.jpg">
          </label>
        </div>

        <label>
          الوصف
          <textarea name="desc" placeholder="اكتب وصف المنتج هنا..."></textarea>
        </label>

        <div class="actions">
          <button type="submit" class="primary">حفظ المنتج</button>
          <button type="button" class="secondary" id="resetFormBtn">مسح الحقول</button>
        </div>
      </form>

      <div id="status" class="status"></div>

      <div class="list" id="productList"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'dent_supply_products_v1';
    const DEFAULT_PRODUCTS = [
      { id: 'p1', cat: 'exam', name: 'مسبر أسنان مزدوج', desc: 'مسبر فحص دقيق من ستانلس ستيل طبي.', price: 8500, image_url: 'https://raw.githubusercontent.com/HUssiansk/Dent-Supplay/main/products/p1.jpg' },
      { id: 'p2', cat: 'exam', name: 'مرآة فحص فم رقم 5', desc: 'مرآة عاكسة بجودة عالية ومقبض مريح.', price: 6000, image_url: 'https://raw.githubusercontent.com/HUssiansk/Dent-Supplay/main/products/p2.jpg' },
      { id: 'p3', cat: 'exam', name: 'ملقط فحص أسنان', desc: 'ملقط دقيق لإمساك القطن والمواد أثناء الفحص.', price: 7000, image_url: 'https://raw.githubusercontent.com/HUssiansk/Dent-Supplay/main/products/p3.jpg' },
      { id: 'p4', cat: 'fill', name: 'طقم أدوات حشو مركب', desc: 'طقم كامل لوضع وتشكيل الحشوات التجميلية.', price: 32000, image_url: 'https://raw.githubusercontent.com/HUssiansk/Dent-Supplay/main/products/p4.webp' },
      { id: 'p5', cat: 'fill', name: 'سباتيولا خلط الحشوة', desc: 'مقاس مزدوج لخلط مواد الحشو والسمنت.', price: 9500, image_url: 'https://raw.githubusercontent.com/HUssiansk/Dent-Supplay/main/products/p5.jpg' },
      { id: 'p12', cat: 'consumables', name: 'قفازات فحص لاتكس', desc: 'صندوق 100 قفاز، مقاسات متعددة.', price: 12000, image_url: 'https://raw.githubusercontent.com/HUssiansk/Dent-Supplay/main/products/p12.jpg' }
    ];

    const catNames = {
      exam: 'أدوات فحص',
      fill: 'حشو وترميم',
      surgery: 'جراحة وقلع',
      clean: 'تنظيف وتلميع',
      consumables: 'مستهلكات'
    };

    function getProducts() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length) return parsed;
        }
      } catch (e) {}
      localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_PRODUCTS));
      return DEFAULT_PRODUCTS;
    }

    function saveProducts(products) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
    }

    function showStatus(msg, isError = false) {
      const status = document.getElementById('status');
      status.textContent = msg;
      status.classList.add('show');
      status.style.background = isError ? '#fff3f1' : '#edf8f2';
      status.style.borderColor = isError ? '#f0d8d1' : '#cfeadf';
      status.style.color = isError ? '#b3543f' : '#1b9c6b';
    }

    function renderList() {
      const list = document.getElementById('productList');
      const products = getProducts();

      if (!products.length) {
        list.innerHTML = '<div class=\"item\"><div><strong>لا توجد منتجات حتى الآن</strong><small>استخدم النموذج أعلاه لإضافة منتج جديد</small></div></div>';
        return;
      }

      list.innerHTML = products.map((p) => `
        <div class="item">
          <div>
            <strong>${p.name}</strong>
            <small>${catNames[p.cat] || p.cat} • ${Number(p.price || 0).toLocaleString('ar-IQ')} د.ع</small>
          </div>
          <div class="item-actions">
            <button class="mini" type="button" data-edit="${p.id}">تعديل</button>
            <button class="mini danger" type="button" data-delete="${p.id}">حذف</button>
          </div>
        </div>
      `).join('');
    }

    function resetForm() {
      document.getElementById('productForm').reset();
      document.querySelector('[name="price"]').value = '0';
    }

    document.getElementById('productForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const product = {
        id: 'p' + Date.now(),
        name: formData.get('name')?.toString().trim(),
        cat: formData.get('cat')?.toString() || 'exam',
        price: Number(formData.get('price') || 0),
        desc: formData.get('desc')?.toString().trim() || '',
        image_url: formData.get('image_url')?.toString().trim() || ''
      };

      if (!product.name) {
        showStatus('يرجى كتابة اسم المنتج.', true);
        return;
      }

      const products = getProducts();
      products.unshift(product);
      saveProducts(products);
      renderList();
      showStatus('تم حفظ المنتج بنجاح.');
      resetForm();
    });

    document.getElementById('productList').addEventListener('click', (e) => {
      const editBtn = e.target.closest('[data-edit]');
      const deleteBtn = e.target.closest('[data-delete]');
      const products = getProducts();

      if (editBtn) {
        const id = editBtn.dataset.edit;
        const product = products.find((p) => String(p.id) === String(id));
        if (!product) return;

        const form = document.getElementById('productForm');
        form.name.value = product.name || '';
        form.cat.value = product.cat || 'exam';
        form.price.value = Number(product.price || 0);
        form.desc.value = product.desc || '';
        form.image_url.value = product.image_url || '';

        showStatus('تم تحميل المنتج في النموذج، قم بالتعديل ثم احفظه.');
      }

      if (deleteBtn) {
        const id = deleteBtn.dataset.delete;
        const next = products.filter((p) => String(p.id) !== String(id));
        saveProducts(next);
        renderList();
        showStatus('تم حذف المنتج بنجاح.');
      }
    });

    document.getElementById('resetFormBtn').addEventListener('click', () => {
      resetForm();
      showStatus('تم مسح الحقول.');
    });

    renderList();
  </script>
</body>
</html>
