<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة Dent Supply</title>

<style>
:root{
  --bg:#f4f8fb;
  --panel:#fff;
  --ink:#16323f;
  --soft:#4c6673;
  --primary:#1c6e8c;
  --dark:#124a5f;
  --line:#dfeaf0;
  --ok:#16865b;
  --danger:#b3543f
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Segoe UI,Tahoma,sans-serif
}

.wrap{
  max-width:1000px;
  margin:auto;
  padding:28px 16px 60px
}

.panel{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:24px;
  box-shadow:0 14px 40px #16323f14
}

.brand{
  display:flex;
  gap:12px;
  align-items:center;
  color:var(--dark);
  margin-bottom:18px
}

.mark{
  width:48px;
  height:48px;
  border-radius:14px;
  background:var(--primary);
  display:grid;
  place-items:center
}

.mark svg{
  width:28px;
  stroke:#fff
}

.brand strong{
  display:block;
  font-size:1.15rem
}

.brand small{
  color:var(--soft)
}

h1{
  margin:0 0 10px;
  color:var(--dark)
}

.sub{
  margin:0 0 20px;
  color:var(--soft)
}

form{
  display:grid;
  gap:14px
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px
}

label{
  display:grid;
  gap:7px;
  font-weight:700
}

input,select,textarea{
  width:100%;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fbfdff;
  font:inherit;
  color:var(--ink)
}

input[type="file"]{
  cursor:pointer;
  padding:10px
}

textarea{
  min-height:100px;
  resize:vertical
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap
}
